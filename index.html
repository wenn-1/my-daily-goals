<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="记录每日蛋白质、训练、英语学习与睡眠，养成稳定进步的习惯。">
<meta name="theme-color" content="#f5e8df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的每日目标">
<meta property="og:title" content="我的每日目标">
<meta property="og:description" content="记录训练、饮食、英语与睡眠，今天也要保持好状态。">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>我的每日目标</title>
<style>
:root{--ink:#202b3c;--muted:#718096;--orange:#ef704c;--cream:#f7eee7;--line:#ffffffb8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,#e7e9e7,#f6dcd3 48%,#d7e8e5);min-height:100vh}
main{max-width:760px;margin:auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 18px}
h1{font-size:25px;margin:0;font-weight:850;letter-spacing:.3px}.date{color:var(--muted);font-size:14px;margin-top:5px}
.pill{border:0;border-radius:24px;background:#fff9;padding:11px 16px;color:var(--ink);font-weight:700}
.pill.small{padding:8px 14px;font-size:13px}
.card{background:#fff9;border:1px solid var(--line);border-radius:27px;padding:22px;margin:0 0 15px;box-shadow:0 8px 24px #44556610;backdrop-filter:blur(12px)}
.hero{background:linear-gradient(125deg,#f8e0d8ed,#f5eee4ed)}.eyebrow{font-size:14px;color:#617286}
h2{font-size:29px;line-height:1.25;margin:10px 0}.sub{color:var(--muted);font-size:14px}
.progress{height:10px;background:#d9dfe0;border-radius:20px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ed7653,#ef704c);border-radius:20px;width:0;transition:width .35s}
.checks{display:flex;gap:9px;flex-wrap:wrap}.check{border:0;border-radius:22px;background:#fff;padding:10px 15px;color:var(--orange);font-weight:750;box-shadow:0 3px 10px #3331;transition:.2s}.check.done{background:#fff0e9;outline:2px solid #efb19d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{min-height:165px}.tilehead{display:flex;align-items:center;gap:9px;color:#65768a;font-weight:700;font-size:14px}.emoji{width:40px;height:40px;border-radius:15px;background:#f6e5d9;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.value{font-size:30px;font-weight:850;margin:14px 0 5px}.tile input,.field input,.field select{width:100%;border:1px solid #d9dfdf;border-radius:13px;padding:11px;background:#fff9;font-size:16px;color:var(--ink);margin-top:7px}
.field{margin-top:12px}.field label{font-size:13px;color:var(--muted);font-weight:650;display:block}
button{cursor:pointer;font-family:inherit}.action{border:0;border-radius:15px;background:var(--orange);color:#fff;padding:12px 17px;font-weight:750;margin-top:12px;transition:filter .15s}.action:active{filter:brightness(.9)}
.goalBtn{cursor:pointer;border-bottom:1px dotted currentColor}
.section-title{font-size:20px;font-weight:850;margin:23px 4px 12px}
.note{font-size:12px;color:#758396;text-align:center;padding:12px}
.history{white-space:pre-wrap;font-size:13px;color:#64748b;line-height:1.6}
.tools{display:flex;gap:9px;justify-content:center;margin:4px 0 8px}
.days{display:flex;gap:8px;align-items:flex-end;height:78px;padding-top:4px}
.daybar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.daybar i{width:100%;max-width:28px;border-radius:8px;background:#d9dfe0;min-height:5px;transition:height .3s}
.daybar i.some{background:#f0b9a4}.daybar i.full{background:var(--orange)}
.daybar em{font-style:normal;font-size:11px;color:var(--muted)}
.daybar.today em{color:var(--orange);font-weight:750}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:#202b3ce6;color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:390px){main{padding:12px}.card{padding:18px}.grid{gap:10px}.value{font-size:26px}}
@media(prefers-color-scheme:dark){
 :root{--ink:#e8edf4;--muted:#9aa8b8;--line:#ffffff22}
 body{background:linear-gradient(145deg,#1c2430,#2a2430 48%,#1f2e2c)}
 .card{background:#ffffff14;box-shadow:0 8px 24px #0006}
 .hero{background:linear-gradient(125deg,#3a2f2bd9,#2f3130d9)}
 .pill{background:#ffffff14}.tile input,.field input{background:#ffffff14;border-color:#ffffff33;color:var(--ink)}
 .progress{background:#ffffff22}.emoji{background:#ffffff18}
 .check{background:#ffffff14;box-shadow:none}.check.done{background:#ef704c26;outline-color:#c98268}
 .note{color:#8fa0b0}.history{color:#9aa8b8}.daybar i{background:#ffffff22}
}
</style>
</head>
<body>
<main>
<header><div><h1>我的每日目标</h1><div class="date" id="today"></div></div><button class="pill" id="resetDay">今日重置</button></header>
<section class="card hero">
<div class="eyebrow" id="streakLine">每日状态 · 稳定进步</div>
<h2 id="headline">今天也要保持好状态</h2>
<div class="sub" id="profileLine">记录你的训练、饮食、英语与睡眠</div>
<div class="progress"><span id="dailyBar"></span></div>
<div class="checks" id="checks"></div>
</section>
<div class="grid">
<section class="card tile">
<div class="tilehead"><span class="emoji" aria-hidden="true">🥚</span>今日蛋白质</div>
<div class="value"><span id="proteinVal">0</span> g</div>
<div class="sub">目标 <span id="proteinGoalText" class="goalBtn" title="点击修改目标">120</span> g</div>
<div class="progress"><span id="proteinBar"></span></div>
<div class="field"><label for="proteinAdd">新增蛋白质（克）</label><input id="proteinAdd" type="number" min="0" inputmode="decimal" placeholder="例如 25"></div>
<button class="action" id="addProtein">记录摄入</button>
</section>
<section class="card tile">
<div class="tilehead"><span class="emoji" aria-hidden="true">🏋️</span>今日训练</div>
<div class="value" id="workoutValue">未记录</div>
<div class="sub" id="workoutSub">记录训练内容与时长</div>
<div class="field"><label for="workoutName">训练内容</label><input id="workoutName" placeholder="例如：胸 + 三头"></div>
<div class="field"><label for="workoutMinutes">训练分钟数</label><input id="workoutMinutes" type="number" min="0" inputmode="numeric" placeholder="分钟"></div>
<button class="action" id="saveWorkout">保存训练</button>
</section>
<section class="card tile">
<div class="tilehead"><span class="emoji" aria-hidden="true">📚</span>英语学习</div>
<div class="value"><span id="englishVal">0</span> 分钟</div>
<div class="sub">今日新词 <span id="wordsVal">0</span> 个</div>
<div class="field"><label for="englishAdd">本次学习分钟数</label><input id="englishAdd" type="number" min="0" inputmode="numeric" placeholder="分钟"></div>
<div class="field"><label for="wordsAdd">新增单词数</label><input id="wordsAdd" type="number" min="0" inputmode="numeric" placeholder="个数"></div>
<button class="action" id="addEnglish">记录学习</button>
</section>
<section class="card tile">
<div class="tilehead"><span class="emoji" aria-hidden="true">🌙</span>昨晚睡眠</div>
<div class="value"><span id="sleepVal">—</span><small style="font-size:16px"> 小时</small></div>
<div class="sub">建议目标 7–9 小时</div>
<div class="field"><label for="sleepInput">睡眠时长</label><input id="sleepInput" type="number" min="0" max="24" step=".5" inputmode="decimal" placeholder="例如 7.5"></div>
<button class="action" id="saveSleep">保存睡眠</button>
</section>
</div>
<div class="section-title">身体数据</div>
<section class="card">
<div class="grid">
<div class="field"><label for="weight">体重（kg）</label><input id="weight" type="number" step=".1" inputmode="decimal" placeholder="例如 72.5"></div>
<div class="field"><label for="height">身高（cm）</label><input id="height" type="number" inputmode="numeric" placeholder="例如 183"></div>
</div>
<button class="action" id="saveBody">保存身体数据</button>
<div class="sub" id="bodySummary" style="margin-top:12px">填写身高和体重，开始追踪变化。</div>
</section>
<div class="section-title">最近 7 天</div>
<section class="card"><div class="days" id="days"></div></section>
<div class="section-title">今日记录</div>
<section class="card"><div class="history" id="history">还没有记录。完成一项后会显示在这里。</div></section>
<div class="tools">
<button class="pill small" id="exportBtn">导出备份</button>
<button class="pill small" id="importBtn">导入备份</button>
<input type="file" id="importFile" accept="application/json,.json" class="sr" aria-hidden="true" tabindex="-1">
</div>
<div class="note">数据保存在当前设备浏览器中。换手机或清除浏览器数据前，请先「导出备份」。</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='daily-goals-v2',OLD_KEY='daily-goals-v1';
const tasks=['训练','饮食','英语','睡眠'];
const dKey=d=>d.toLocaleDateString('sv-SE');
const todayKey=()=>dKey(new Date());
const fresh=()=>({date:todayKey(),checks:{},protein:0,proteinGoal:120,english:0,words:0,sleep:null,workout:'',minutes:0,weight:'',height:'',logs:[],past:[]});
let data;
try{data=JSON.parse(localStorage.getItem(KEY))||null}catch{data=null}
if(!data||typeof data!=='object'||data.date===undefined){ // 兼容旧版本数据
 let old=null;try{old=JSON.parse(localStorage.getItem(OLD_KEY))}catch{}
 data=fresh();
 if(old&&typeof old==='object'){data.weight=old.weight||'';data.height=old.height||'';data.logs=old.logs||[]}
}
// 跨天：把昨天的数据归档到 past，再开新的一天
if(data.date!==todayKey()){
 const had=tasks.some(t=>data.checks&&data.checks[t])||data.protein>0||data.english>0||!!data.workout||data.sleep;
 const past=data.past||[];
 if(had)past.unshift({date:data.date,checks:data.checks||{},protein:data.protein,proteinGoal:data.proteinGoal,english:data.english,words:data.words,sleep:data.sleep,workout:data.workout,minutes:data.minutes});
 data={...fresh(),weight:data.weight||'',height:data.height||'',logs:data.logs||[],past:past.slice(0,90)};
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function log(s){data.logs.unshift(new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · '+s);data.logs=data.logs.slice(0,30)}
function doneDay(d){return d&&(tasks.some(t=>d.checks&&d.checks[t])||d.protein>0||d.english>0||!!d.workout||d.sleep)}
function streak(){
 const map={};(data.past||[]).forEach(p=>map[p.date]=p);
 let s=doneDay(data)?1:0,d=new Date();
 if(!s)d.setDate(d.getDate()-1);
 while(doneDay(map[dKey(d)])){s++;d.setDate(d.getDate()-1)}
 return s;
}
function render(){
 document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 const st=streak();
 document.getElementById('streakLine').textContent=st>0?`每日状态 · 连续打卡 ${st} 天`:'每日状态 · 稳定进步';
 document.getElementById('checks').innerHTML=tasks.map(t=>`<button class="check ${data.checks[t]?'done':''}" data-task="${t}" aria-pressed="${!!data.checks[t]}">${data.checks[t]?'✓':'○'} ${t}</button>`).join('');
 document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=b.dataset.task;data.checks[t]=!data.checks[t];log((data.checks[t]?'完成':'取消')+'「'+t+'」打卡');save()});
 const count=tasks.filter(t=>data.checks[t]).length;
 document.getElementById('dailyBar').style.width=count*25+'%';
 document.getElementById('headline').textContent=count===4?'今天全勤，状态拉满':(count===0?'今天也要保持好状态':`今日完成 ${count}/4 项，继续加油`);
 document.getElementById('proteinVal').textContent=data.protein;
 document.getElementById('proteinGoalText').textContent=data.proteinGoal;
 document.getElementById('proteinBar').style.width=Math.min(100,data.protein/data.proteinGoal*100)+'%';
 document.getElementById('workoutValue').textContent=data.workout||'未记录';
 document.getElementById('workoutSub').textContent=data.minutes?`今天已训练 ${data.minutes} 分钟`:'记录训练内容与时长';
 document.getElementById('englishVal').textContent=data.english;document.getElementById('wordsVal').textContent=data.words;
 document.getElementById('sleepVal').textContent=data.sleep??'—';
 document.getElementById('weight').value=data.weight||'';document.getElementById('height').value=data.height||'';
 const w=Number(data.weight),h=Number(data.height);
 document.getElementById('bodySummary').textContent=w>0&&h>0?`当前 ${h} cm · ${w} kg · BMI ${(w/((h/100)**2)).toFixed(1)}`:'填写身高和体重，开始追踪变化。';
 document.getElementById('history').textContent=data.logs.length?data.logs.join('\n'):'还没有记录。完成一项后会显示在这里。';
 // 最近 7 天
 const map={};(data.past||[]).forEach(p=>map[p.date]=p);
 let html='';
 for(let i=6;i>=0;i--){
  const d=new Date();d.setDate(d.getDate()-i);const k=dKey(d);
  const p=k===data.date?data:map[k];
  const c=p?tasks.filter(t=>p.checks&&p.checks[t]).length:0;
  const cls=c===4?'full':(c>0?'some':'');
  html+=`<div class="daybar${i===0?' today':''}"><i class="${cls}" style="height:${c===0?5:Math.round(12+c/4*66)}px" title="${k} 完成 ${c}/4"></i><em>${d.getMonth()+1}/${d.getDate()}</em></div>`;
 }
 document.getElementById('days').innerHTML=html;
}
document.getElementById('addProtein').onclick=()=>{let n=Number(proteinAdd.value);if(n>0){data.protein+=n;data.checks['饮食']=true;log(`蛋白质摄入 ${n} g（共 ${data.protein} g）`);proteinAdd.value='';save();if(data.protein>=data.proteinGoal)toast('蛋白质目标达成 💪')}else toast('请输入大于 0 的数字')};
document.getElementById('saveWorkout').onclick=()=>{let n=workoutName.value.trim(),m=Number(workoutMinutes.value)||0;if(n){data.workout=n;data.minutes=m;data.checks['训练']=true;log(`训练：${n}（${m} 分钟）`);workoutName.value='';workoutMinutes.value='';save();toast('训练已记录 🏋️')}else toast('请先填写训练内容')};
document.getElementById('addEnglish').onclick=()=>{let m=Number(englishAdd.value)||0,w=Number(wordsAdd.value)||0;if(m>=0&&w>=0&&(m||w)){data.english+=m;data.words+=w;data.checks['英语']=true;log(`英语学习 ${m} 分钟，新增单词 ${w} 个`);englishAdd.value='';wordsAdd.value='';save();toast('学习已记录 📚')}else toast('请填写学习时长或单词数')};
document.getElementById('saveSleep').onclick=()=>{let n=Number(sleepInput.value);if(n>0&&n<=24){data.sleep=n;data.checks['睡眠']=true;log(`睡眠记录 ${n} 小时${n<7?'（略短，注意休息）':n>9?'（很充足）':''}`);sleepInput.value='';save();toast('睡眠已记录 🌙')}else toast('请输入 0–24 之间的时长')};
document.getElementById('saveBody').onclick=()=>{
 let w=Number(weight.value),h=Number(height.value);
 if(weight.value&&(w<20||w>300))return toast('体重需在 20–300 kg 之间');
 if(height.value&&(h<50||h>250))return toast('身高需在 50–250 cm 之间');
 if(!weight.value&&!height.value)return toast('请至少填写一项');
 data.weight=weight.value;data.height=height.value;log(`更新身体数据 ${w} kg / ${h} cm`);save();toast('身体数据已保存');
};
document.getElementById('proteinGoalText').onclick=()=>{
 let n=Number(prompt('设置每日蛋白质目标（克）',data.proteinGoal));
 if(n>0&&n<=1000){data.proteinGoal=Math.round(n);save();toast('目标已更新')}else if(!isNaN(n)&&n!==0)toast('请输入 1–1000 之间的数字');
};
document.getElementById('resetDay').onclick=()=>{if(confirm('重置今天的打卡和每日数据？身体数据与历史记录会保留。')){let keep={weight:data.weight,height:data.height,logs:data.logs,past:data.past};data={...fresh(),...keep};save();toast('今日数据已重置')}};
document.getElementById('exportBtn').onclick=()=>{
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=`daily-goals-backup-${todayKey()}.json`;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('备份文件已导出');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||typeof d!=='object'||d.date===undefined)throw 0;
  d.past=Array.isArray(d.past)?d.past:[];d.logs=Array.isArray(d.logs)?d.logs:[];
  if(d.date!==todayKey()){ // 导入的历史数据先归档
   if(doneDay(d))d.past.unshift({date:d.date,checks:d.checks||{},protein:d.protein,proteinGoal:d.proteinGoal||120,english:d.english,words:d.words,sleep:d.sleep,workout:d.workout,minutes:d.minutes});
   d={...fresh(),weight:d.weight||'',height:d.height||'',logs:d.logs,past:d.past};
  }
  data=d;save();toast('备份已导入');
 }catch{toast('导入失败：文件格式不正确')}e.target.value=''};
 r.readAsText(f);
};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
